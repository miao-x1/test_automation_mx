# ================================================================== #
#  生产级 Docker Compose — 企业级部署配置                            #
#                                                                    #
#  包含 9 个服务:                                                     #
#    基础设施: mysql, redis, etcd, minio, milvus, neo4j             #
#    应用层:   backend, worker, frontend                             #
#                                                                    #
#  使用方式:                                                          #
#    cp .env.production .env                                         #
#    docker compose -f docker-compose.prod.yml up -d --build         #
#                                                                    #
#  资源限制按 16GB RAM / 8 CPU 服务器配置, 按实际调整                  #
# ================================================================== #

version: "3.9"

services:
  # ============================================================
  # 基础设施层
  # ============================================================

  # ---- MySQL 8.0 (关系数据库) ----
  mysql:
    image: mysql:8.0
    container_name: prod_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/docker/.env.production}
      MYSQL_DATABASE: ${DB_NAME:-test_automation}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --slow-query-log=ON
      --long-query-time=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - prod_net

  # ---- Redis 7 (缓存 + 任务队列) ----
  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - prod_net

  # ---- etcd (Milvus 依赖) ----
  etcd:
    image: bitnamilegacy/etcd:3.5
    container_name: prod_etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ALLOW_NONE_AUTHENTICATION: "yes"
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - prod_net

  # ---- MinIO (Milvus 对象存储) ----
  minio:
    image: minio/minio:RELEASE.2023-03-24T21-41-23Z
    container_name: prod_minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - prod_net

  # ---- Milvus 2.4 (向量数据库) ----
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: prod_milvus
    restart: always
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - prod_net

  # ---- Neo4j 5.20 (图数据库) ----
  neo4j:
    image: neo4j:5.20.0
    container_name: prod_neo4j
    restart: always
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      TZ: Asia/Shanghai
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - prod_net

  # ============================================================
  # 应用层
  # ============================================================

  # ---- Backend (FastAPI API 服务) ----
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: prod_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_NAME=${DB_NAME:-test_automation}
      - USE_SQLITE=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=True
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_STANDALONE=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - APP_ENV=production
      - DEBUG=False
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_logs:/app/logs
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - prod_net

  # ---- Agent Worker (独立任务执行进程) ----
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    container_name: prod_worker
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - DB_NAME=${DB_NAME:-test_automation}
      - USE_SQLITE=False
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=True
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_STANDALONE=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - APP_ENV=production
      - DEBUG=False
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - WORKER_ID=${WORKER_ID:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os; r=redis.from_url(f'redis://{os.getenv(\"REDIS_HOST\",\"redis\")}:{os.getenv(\"REDIS_PORT\",\"6379\")}/{os.getenv(\"REDIS_DB\",\"0\")}'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    networks:
      - prod_net

  # ---- Frontend (React + Nginx) ----
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: prod_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - prod_net

# ============================================================
# 持久化卷
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  backend_uploads:
    driver: local
  backend_reports:
    driver: local
  backend_logs:
    driver: local
  backend_data:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  prod_net:
    driver: bridge
    name: test_automation_prod_net
