# ================================================================== #
#  Test-Automation 企业级部署                                        #
#  一键启动: docker compose up -d                                     #
# ================================================================== #

services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: test_auto_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-magic1212}
      MYSQL_DATABASE: ${DB_NAME:-test_automation}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-magic1212}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - test_auto_net

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: test_auto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - test_auto_net

  # ==================== Milvus (Standalone) ====================
  # Milvus Standalone 需要 etcd + minio 作为依赖
  etcd:
    container_name: milvus-etcd
    image: bitnamilegacy/etcd:3.5
    restart: unless-stopped
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_ADVERTISE_CLIENT_URLS=http://milvus-etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://localhost:2379 endpoint health"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - test_auto_net

  minio:
    image: minio/minio:RELEASE.2023-03-24T21-41-23Z
    container_name: test_auto_minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - test_auto_net

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: test_auto_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - test_auto_net

  # ==================== Neo4j ====================
  neo4j:
    image: neo4j:5.20.0
    container_name: test_auto_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_secure_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 512M
      NEO4J_dbms_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # Web 界面
      - "7687:7687"   # Bolt 协议
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - test_auto_net

  # ==================== Backend (FastAPI) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: test_auto_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - MILVUS_HOST=milvus
      - MILVUS_STANDALONE=1
      - NEO4J_URI=bolt://neo4j:7687
      - USE_SQLITE=False
      - APP_ENV=production
      - DEBUG=False
      - UPLOAD_DIR=/app/uploads
      - REPORT_DIR=/app/reports
      - DATA_DIR=/app/data
      # R2R 外部知识服务（不随 docker-compose 启动，需单独部署）
      - R2R_BASE_URL=http://localhost:7272
      - R2R_API_KEY=${R2R_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/reports:/app/reports
      - ./data/logs:/app/logs
      - ./data/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - test_auto_net

  # ==================== Frontend (React + Nginx) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: test_auto_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - test_auto_net

# ==================== 网络 ====================
networks:
  test_auto_net:
    driver: bridge

# ==================== 持久化卷 ====================
volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
