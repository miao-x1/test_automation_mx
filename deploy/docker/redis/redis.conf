# Redis 生产配置
# 内存策略: 512MB 限制 + LRU 淘汰
maxmemory 512mb
maxmemory-policy allkeys-lru

# 持久化: AOF + RDB
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# 超时配置
timeout 300
tcp-keepalive 60

# 日志
loglevel notice
logfile ""

# 安全 (生产环境建议设置密码)
# requirepass your-redis-password

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128
