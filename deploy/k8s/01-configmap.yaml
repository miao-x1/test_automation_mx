# ============================================================
# ConfigMap — 非敏感配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: test-automation
  labels:
    app.kubernetes.io/part-of: test-automation-platform
data:
  # 应用
  APP_NAME: "Test-Automation"
  APP_VERSION: "1.0.0"
  APP_ENV: "production"
  DEBUG: "False"
  CORS_ORIGINS: "https://test-automation.example.com"
  ENABLE_DOCS: "False"
  ALLOW_REGISTER: "False"
  REGISTER_REQUIRE_APPROVAL: "False"
  AUTH_REQUIRED: "True"
  ENABLE_MCP: "False"
  COOKIE_SECURE: "True"
  RATE_LIMIT_ENABLED: "True"
  RATE_LIMIT_LLM_PER_MINUTE: "30"
  RATE_LIMIT_LOGIN_PER_MINUTE: "10"
  KNOWLEDGE_PROVIDER: "local"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  LOG_PATH: "logs"
  UPLOAD_DIR: "uploads"
  MAX_UPLOAD_SIZE: "10485760"
  REPORT_DIR: "reports"

  # MySQL
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_USER: "root"
  DB_NAME: "test_automation"
  DB_ECHO: "False"
  USE_SQLITE: "False"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_ENABLED: "True"

  # Milvus
  MILVUS_HOST: "milvus"
  MILVUS_PORT: "19530"
  MILVUS_STANDALONE: "1"
  EMBEDDING_PROVIDER: "dashscope"
  EMBEDDING_MODEL: "text-embedding-v3"
  EMBEDDING_DIM: "1024"

  # Neo4j
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"

  # LLM Gateway
  LLM_GATEWAY_ENABLED: "True"
  LLM_GATEWAY_DEFAULT_CHAIN: "default"
  LLM_GATEWAY_FALLBACK_CHAIN: "qwen:qwen-plus,deepseek:deepseek-chat,ollama:qwen2.5:7b,mock:mock-model"
  LLM_GATEWAY_CIRCUIT_THRESHOLD: "3"
  LLM_GATEWAY_CIRCUIT_COOLDOWN: "60"
  LLM_GATEWAY_LOG_ENABLED: "True"

  # Agent
  AGENT_TYPE: "autogen"
  AGENT_TIMEOUT: "300"
  WORKER_CONCURRENCY: "4"

  # Playwright
  PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"

---
# ============================================================
# ConfigMap — MySQL 配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: test-automation
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_connections=200
    innodb_buffer_pool_size=1G
    innodb_log_file_size=256M
    slow_query_log=ON
    long_query_time=2
    default-time-zone='+08:00'
    [client]
    default-character-set=utf8mb4

---
# ============================================================
# ConfigMap — Redis 配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: test-automation
data:
  redis.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    timeout 300
    tcp-keepalive 60
    loglevel notice

---
# ============================================================
# ConfigMap — Nginx 前端配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: test-automation
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://backend:8000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
