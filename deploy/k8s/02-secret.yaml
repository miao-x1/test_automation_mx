# ============================================================
# Secret — 敏感配置 (生产环境必须替换!)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: test-automation
  labels:
    app.kubernetes.io/part-of: test-automation-platform
type: Opaque
stringData:
  # JWT 密钥 (生产环境替换为随机 64 字符串)
  SECRET_KEY: "CHANGE-ME-TO-A-RANDOM-64-CHAR-STRING"

  # MySQL 密码
  DB_PASSWORD: "magic1212"

  # Neo4j 密码
  NEO4J_PASSWORD: "password"

  # Redis 密码 (如启用)
  REDIS_PASSWORD: ""

  # LLM API Keys (生产环境必填)
  QWEN_API_KEY: "sk-your-dashscope-api-key"
  DEEPSEEK_API_KEY: "sk-your-deepseek-api-key"
  OPENAI_API_KEY: "sk-your-openai-api-key"

  # R2R 知识服务
  R2R_API_KEY: ""
